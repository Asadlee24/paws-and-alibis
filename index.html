<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#191914"><meta name="description" content="Explore the bazaar, find the biryani thief and chase them through the back alleys."><link rel="icon" href="/art/favicon.svg" type="image/svg+xml"><title>Paws &amp; Alibis — Qissa Khwani</title></head>
